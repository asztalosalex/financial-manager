# LOAD-BEARING - both lines below must keep a value that DIFFERS from the placeholder
# default in application.properties and from the value application-prod.properties sets.
# They are the baselines ProdProfileProbeTest measures the prod overrides against: if a
# baseline equals the placeholder default, the prod probe passes whether or not
# application-prod.properties is loaded at all, i.e. silently vacuous with a green build.
# TestProfileProbeTest pins both lines so their removal fails loudly instead.
#
# security.cookie.secure=${SECURITY_COOKIE_SECURE:true}      -> baseline false, prod true
# security.cookie.same-site=${SECURITY_COOKIE_SAME_SITE:Lax} -> baseline Strict, prod Lax
#
# Do not "clean up" SECURITY_COOKIE_SAME_SITE back to Lax: Lax is the placeholder default,
# and restoring it re-arms exactly the vacuity trap this block exists to prevent.
SECURITY_COOKIE_SECURE=false
SECURITY_COOKIE_SAME_SITE=Strict

